[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auaka-knowledge-pipeline"
version = "1.5.0"
description = "Offline knowledge-space pipeline for Auaka System"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "numpy>=1.26,<3",
    "umap-learn>=0.5,<1"
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0,<6"
]
dev = [
    "pytest>=7.3,<9"
]

[project.scripts]
auaka-pipeline = "auaka_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
